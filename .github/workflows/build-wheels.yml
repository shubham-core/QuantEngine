name: Build Python Wheels

# Triggered on tagged releases (v*) or manually via workflow_dispatch.
# Publishes wheels to PyPI and uploads them as GitHub Release assets.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish to PyPI after building wheels?"
        type: boolean
        default: false

jobs:
  # -------------------------------------------------------------------------
  # Build native wheels on each platform with cibuildwheel
  # -------------------------------------------------------------------------
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux + musllinux
          - windows-latest     # win32 + win_amd64
          - macos-latest       # universal2 (arm64 + x86_64)

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # full history for version detection

      # -----------------------------------------------------------------------
      # Platform-specific build tool setup
      # -----------------------------------------------------------------------
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      # -----------------------------------------------------------------------
      # Set up Python (needed to run cibuildwheel itself)
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0

      # -----------------------------------------------------------------------
      # Build wheels with cibuildwheel
      # Env vars configure which Python versions and platforms to target.
      # -----------------------------------------------------------------------
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # CPython 3.9 – 3.12 only (no PyPy, no 3.8 EOL)
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-win32 *-musllinux_i686"

          # ---- Linux ----
          # Build inside manylinux_2_28 (GCC 12) for broad glibc compat
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "quay.io/pypa/manylinux_2_28_aarch64"
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y cmake ninja-build || dnf install -y cmake ninja-build

          # ---- macOS ----
          # Build universal2 wheels (arm64 + x86_64) for Apple Silicon support
          CIBW_ARCHS_MACOS: "universal2"
          CIBW_BEFORE_ALL_MACOS: |
            brew install cmake ninja || true

          # ---- Windows ----
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_ALL_WINDOWS: ""

          # ---- Build environment ----
          # Tell scikit-build-core / setuptools to use CMake Release preset
          CMAKE_BUILD_TYPE: Release
          CIBW_BUILD_VERBOSITY: 1

          # ---- Tests inside cibuildwheel ----
          # Run the Python bindings tests after each wheel is built
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {project}/tests/python -v --tb=short"

      # -----------------------------------------------------------------------
      # Upload wheel artifacts so they can be downloaded regardless of PyPI
      # -----------------------------------------------------------------------
      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 30

  # -------------------------------------------------------------------------
  # Build the source distribution (sdist)
  # -------------------------------------------------------------------------
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist --outdir dist/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 30

  # -------------------------------------------------------------------------
  # Publish to PyPI (only on tagged releases, or when manually enabled)
  # -------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Only publish on vX.Y.Z tags or when workflow_dispatch sets publish_to_pypi=true
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true')
    environment:
      name: pypi
      url: https://pypi.org/p/quantengine
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          path: dist/
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: List distributions to publish
        run: ls -lh dist/

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed — uses GitHub OIDC trusted publishing.
        # Configure at: https://pypi.org/manage/account/publishing/

  # -------------------------------------------------------------------------
  # Create GitHub Release and attach wheels
  # -------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
